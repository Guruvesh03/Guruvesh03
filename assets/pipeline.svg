<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="100%" height="300" fill="none">
  <defs>
    <linearGradient id="pipe-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080C16"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow-p" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="960" height="300" rx="14" fill="url(#pipe-bg)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Top Title -->
  <text x="36" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="700" fill="#38BDF8" letter-spacing="2">03 // ARCHITECTURAL DATAFLOW &amp; REQUEST LIFECYCLE</text>
  <text x="36" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#94A3B8">How client state, backend APIs, and storage pipelines interact in full-stack systems</text>

  <!-- Wire 1: HTTP Request -->
  <path d="M255 124 H385" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="2"/>
  <circle r="4.5" fill="#38BDF8" filter="url(#glow-p)">
    <animateMotion path="M255 124 H385" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <text x="320.0" y="116" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="9" fill="#38BDF8" font-weight="600">HTTP / JSON PAYLOAD</text>

  <!-- Wire 2: JSON Response -->
  <path d="M385 156 H255" stroke="#F472B6" stroke-opacity="0.3" stroke-width="2"/>
  <circle r="4.5" fill="#F472B6" filter="url(#glow-p)">
    <animateMotion path="M385 156 H255" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="320.0" y="174" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="9" fill="#F472B6" font-weight="600">RESPONSE STREAM</text>

  <!-- Wire 3: SQL Query -->
  <path d="M575 124 H705" stroke="#34D399" stroke-opacity="0.3" stroke-width="2"/>
  <circle r="4.5" fill="#34D399" filter="url(#glow-p)">
    <animateMotion path="M575 124 H705" dur="1.9s" repeatCount="indefinite"/>
  </circle>
  <text x="640.0" y="116" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="9" fill="#34D399" font-weight="600">SQL QUERIES / POOL</text>

  <!-- Wire 4: Database Rows -->
  <path d="M705 156 H575" stroke="#FBBF24" stroke-opacity="0.3" stroke-width="2"/>
  <circle r="4.5" fill="#FBBF24" filter="url(#glow-p)">
    <animateMotion path="M705 156 H575" dur="2.1s" repeatCount="indefinite"/>
  </circle>
  <text x="640.0" y="174" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="9" fill="#FBBF24" font-weight="600">ROWSETS &amp; RELATIONS</text>

  <!-- Branch Wire: ML Ingestion -->
  <path d="M480 179 V225" stroke="#A78BFA" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="4 4"/>
  <circle r="4" fill="#A78BFA" filter="url(#glow-p)">
    <animateMotion path="M480 179 V225" dur="1.7s" repeatCount="indefinite"/>
  </circle>

  <!-- Nodes -->
  <rect x="65.0" y="101.0" width="190" height="78" rx="10" fill="#0E1424" stroke="#2563EB" stroke-width="2"/><rect x="65.0" y="101.0" width="4" height="78" rx="2" fill="#60A5FA"/><text x="160" y="136" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#60A5FA">Client UI</text><text x="160" y="156" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="10" fill="#94A3B8">React · Modern JS · HTML/CSS</text>
  <rect x="385.0" y="101.0" width="190" height="78" rx="10" fill="#0E1424" stroke="#D97706" stroke-width="2"/><rect x="385.0" y="101.0" width="4" height="78" rx="2" fill="#F59E0B"/><text x="480" y="136" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#F59E0B">Python API</text><text x="480" y="156" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="10" fill="#94A3B8">FastAPI / Flask · REST · Auth</text>
  <rect x="705.0" y="101.0" width="190" height="78" rx="10" fill="#0E1424" stroke="#059669" stroke-width="2"/><rect x="705.0" y="101.0" width="4" height="78" rx="2" fill="#34D399"/><text x="800" y="136" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#34D399">Data Persistence</text><text x="800" y="156" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="10" fill="#94A3B8">PostgreSQL · MySQL · MongoDB</text>

  <!-- Bottom ML Engine Node -->
  <g transform="translate(370, 225)">
    <rect width="220" height="42" rx="8" fill="#17122B" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="110" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#C4B5FD">Applied AI/ML Engine</text>
    <text x="110" y="32" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="8.5" fill="#A78BFA">Scikit-Learn · OCR Pipeline · Predictions</text>
  </g>
</svg>